name: orderwala-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_PHP_API: ${REACT_APP_PHP_API:-https://backend.orderwalabd.com/public/api}
        REACT_APP_FILE_BASE: ${REACT_APP_FILE_BASE:-https://backend.orderwalabd.com/public/}
        REACT_APP_HR_API: ${REACT_APP_HR_API:-/dotnet/hr/api}
        REACT_APP_HR_SHIFT_API: ${REACT_APP_HR_SHIFT_API:-/dotnet/um/api/}
        REACT_APP_UM_API: ${REACT_APP_UM_API:-/dotnet/um/api/}
        REACT_APP_USER_API: ${REACT_APP_USER_API:-/dotnet/um/api/UserManagement}
        REACT_APP_SC_API: ${REACT_APP_SC_API:-/dotnet/sc/api}
    image: retail-erp-frontend:latest
    container_name: frontend-web
    environment:
      HR_UPSTREAM: ${HR_UPSTREAM:-http://hr-api:8080}
      UM_UPSTREAM: ${UM_UPSTREAM:-http://usermanagement-api:8080}
      SC_UPSTREAM: ${SC_UPSTREAM:-http://supplychain-api:8080}
    expose:
      - "80"
    networks:
      - orderwala-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  orderwala-net:
    name: dokploy-network
    external: true